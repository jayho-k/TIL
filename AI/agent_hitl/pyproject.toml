[project]
name = "deepagent-hitl-poc"
version = "0.1.0"
description = "DeepAgent nested-subagent HITL proof of concept"
requires-python = ">=3.11,<4.0"
dependencies = [
  "deepagents==0.7.13",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph-checkpoint-redis==0.5.2",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=6.4,<7.0",
  "sse-starlette>=3.0,<4.0",
  "streamlit>=1.49,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "streamlit_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires the configured Ollama endpoint"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
