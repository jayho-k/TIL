[project]
name = "deepagent-production-streaming"
version = "0.1.0"
description = "Production-oriented DeepAgent SSE transport comparison"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncpg>=0.30,<1.0",
  "deepagents==0.7.13",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph-checkpoint-redis==0.5.2",
  "prometheus-client>=0.22,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "redis>=6.4,<7.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "sse-starlette>=3.0,<4.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "locust>=2.40,<3.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres: requires the configured PostgreSQL instance",
  "redis: requires the configured Redis instance",
  "live: requires the configured Ollama endpoint",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
